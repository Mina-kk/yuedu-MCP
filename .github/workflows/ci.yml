name: CI

on:
  push:
    branches: [main, refactor/rust-vue-reader-semantics]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python and build contracts
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
          python legacy-ui/check_isolation.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: Rust and WebAssembly toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Rust, WASM and Vue production checks
        run: |
          mkdir -p reports/ci
          set -o pipefail
          bash scripts/build-web.sh 2>&1 | tee reports/ci/web.log
      - name: Upload verified web assets
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-ui/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-diagnostics-${{ github.sha }}
          path: reports/ci/
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Kotlin compilation and unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest \
            --no-daemon --console=plain --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8'
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android-apk:
    needs: [contracts, web, android-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-ui/dist/
      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8' \
            -PbuildRevision="${GITHUB_SHA}"
      - name: Verify packaged assets and signature
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          apk = Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert 'assets/web/index.html' in z.namelist(), 'missing Vue entrypoint'
              assert any(n.startswith('assets/web/') and n.endswith('.wasm') for n in z.namelist()), 'missing WASM'
          apk.with_suffix('.apk.sha256').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  ' + apk.name + '\n')
          PY
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yuedu-mcp-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
