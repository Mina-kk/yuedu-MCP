<!doctype html>
<html lang="zh-CN" data-mode="light" data-mode-pref="auto">
  <head>
    <meta charset="utf-8" />
    <!--
      生产 CSP（Android WebViewAssetLoader 内加载 https://appassets.androidplatform.net/assets/web/）：
      - script-src 'self' 'wasm-unsafe-eval'：Rust 核是 wasm-bindgen 产物，需要 wasm-unsafe-eval；
        绝不放 'unsafe-eval'，外部内容不执行脚本。
      - connect-src 'self' + 用户显式配置的运行时地址：浏览器开发时直连 MCP（标准 Streamable HTTP）。
        Android 生产环境不发起网络请求（全部走宿主桥），保留 http/https 只为 Web 模式。
      - frame-src 'none'：外站验证页由宿主在隔离 WebView 里打开，前端绝不创建 iframe。
      - object-src 'none'，base-uri 'none'，form-action 'none'。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F3F3F0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23CCFF4D'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' fill='%23222222'%3EM%3C/text%3E%3C/svg%3E" />
    <title>阅读书源 MCP</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
